{% extends "base.html" %}

{% block title %}Вход — Quotes{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <h1>Вход</h1>

        <form id="login-form">

            <input
                type="text"
                id="login-username"
                placeholder="Имя пользователя"
                minlength="2"
                maxlength="100"
                required
            >

            <button type="submit">
                Войти
            </button>

        </form>

        <p id="login-message"></p>

        <p>
            Нет аккаунта?
            <a href="/users/register">Регистрация</a>
        </p>

    </div>

</div>

{% endblock %}
