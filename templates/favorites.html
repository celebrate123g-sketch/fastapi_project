
{% extends "base.html" %}

{% block title %}
Избранное — Quotes
{% endblock %}

{% block content %}

<div class="page-header">

    <h1>
        Избранное
    </h1>

</div>

<div id="favorites-list">

    <p>
        Загрузка...
    </p>

</div>

<script>

document.addEventListener(
    "DOMContentLoaded",
    async function() {

        const token =
            localStorage.getItem(
                "access_token"
            );

        const list =
            document.getElementById(
                "favorites-list"
            );

        if (!token) {

            window.location.href =
                "/users/login";

            return;
        }

        async function loadFavorites() {

            try {

                const response =
                    await fetch(
                        "/quotes/favorites",
                        {
                            headers: {
                                "Authorization": `Bearer ${token}`
                            }
                        }
                    );

                if (!response.ok) {

                    list.textContent =
                        "Не удалось загрузить избранное.";

                    return;
                }

                const quotes =
                    await response.json();

                list.replaceChildren();

                if (quotes.length === 0) {

                    list.textContent =
                        "В избранном пока нет цитат.";

                    return;
                }

                quotes.forEach(
                    quote => {

                        const element =
                            document.createElement(
                                "article"
                            );

                        element.className =
                            "quote-card";

                        const category =
                            document.createElement(
                                "span"
                            );

                        category.className =
                            "quote-category";

                        category.textContent =
                            quote.category || "";

                        const blockquote =
                            document.createElement(
                                "blockquote"
                            );

                        blockquote.textContent =
                            `“${quote.text}”`;

                        const author =
                            document.createElement(
                                "strong"
                            );

                        author.textContent =
                            quote.author || "Неизвестный автор";

                        const actions =
                            document.createElement(
                                "div"
                            );

                        const link =
                            document.createElement(
                                "a"
                            );

                        link.href =
                            `/quotes-page/${quote.id}`;

                        link.textContent =
                            "Открыть цитату";

                        const button =
                            document.createElement(
                                "button"
                            );

                        button.type = "button";

                        button.className =
                            "remove-favorite";

                        button.dataset.quoteId =
                            quote.id;

                        button.textContent =
                            "Убрать из избранного";

                        button.addEventListener(
                            "click",
                            async function() {

                                try {

                                    const response =
                                        await fetch(
                                            `/quotes/${quote.id}/unfavorite`,
                                            {
                                                method: "PUT",
                                                headers: {
                                                    "Authorization": `Bearer ${token}`
                                                }
                                            }
                                        );

                                    if (!response.ok) {
                                        return;
                                    }

                                    await loadFavorites();

                                } catch (error) {

                                    console.error(error);

                                }

                            }
                        );

                        actions.append(
                            link,
                            button
                        );

                        element.append(
                            category,
                            blockquote,
                            author,
                            actions
                        );

                        list.appendChild(
                            element
                        );

                    }
                );

            } catch (error) {

                console.error(error);

                list.textContent =
                    "Не удалось подключиться к серверу.";

            }
        }

        await loadFavorites();

    }
);

</script>

{% endblock %}
