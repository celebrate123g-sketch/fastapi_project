{% extends "base.html" %}

{% block title %}
Избранное — Quotes
{% endblock %}

{% block content %}

<div class="page-header">

    <h1>
        Избранное
    </h1>

</div>

<div id="favorites-list">

    <p>
        Загрузка...
    </p>

</div>

<script>

document.addEventListener(
    "DOMContentLoaded",
    async function() {

        const userId =
            localStorage.getItem(
                "user_id"
            );

        const list =
            document.getElementById(
                "favorites-list"
            );

        if (!userId) {

            window.location.href =
                "/users/login";

            return;
        }

        async function loadFavorites() {

            const response =
                await fetch(
                    `/quotes/favorites?user_id=${userId}`
                );

            if (!response.ok) {

                list.innerHTML =
                    "<p>Не удалось загрузить избранное.</p>";

                return;
            }

            const quotes =
                await response.json();

            list.innerHTML = "";

            if (quotes.length === 0) {

                list.innerHTML =
                    "<p>В избранном пока нет цитат.</p>";

                return;
            }

            quotes.forEach(
                quote => {

                    const element =
                        document.createElement(
                            "article"
                        );

                    element.className =
                        "quote-card";

                    element.innerHTML = `
                        <span class="quote-category">
                            ${quote.category}
                        </span>

                        <blockquote>
                            “${quote.text}”
                        </blockquote>

                        <strong>
                            ${quote.author}
                        </strong>

                        <div>
                            <a
                                href="/quotes-page/${quote.id}"
                            >
                                Открыть цитату
                            </a>

                            <button
                                type="button"
                                class="remove-favorite"
                                data-quote-id="${quote.id}"
                            >
                                Убрать из избранного
                            </button>
                        </div>
                    `;

                    list.appendChild(
                        element
                    );

                }
            );

            document
                .querySelectorAll(
                    ".remove-favorite"
                )
                .forEach(
                    button => {

                        button.addEventListener(
                            "click",
                            async function() {

                                const quoteId =
                                    this.dataset.quoteId;

                                const response =
                                    await fetch(
                                        `/quotes/${quoteId}/unfavorite?user_id=${userId}`,
                                        {
                                            method: "PUT"
                                        }
                                    );

                                if (!response.ok) {
                                    return;
                                }

                                await loadFavorites();

                            }
                        );

                    }
                );
        }

        await loadFavorites();

    }
);

</script>

{% endblock %}
