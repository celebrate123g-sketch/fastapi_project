{% extends "base.html" %}

{% block title %}Регистрация — Quotes{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <h1>Регистрация</h1>

        <form id="register-form">

            <input
                type="text"
                id="register-username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                id="register-password"
                placeholder="Пароль"
                required
            >

            <button type="submit">
                Зарегистрироваться
            </button>

            <p id="register-message"></p>

        </form>

        <p id="register-message"></p>

        <p>
            Нет аккаунта?
            <a href="/users/register">Регистрация</a>
        </p>

    </div>

</div>

{% endblock %}
